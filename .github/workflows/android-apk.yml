name: Android Offline Loader APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build offline-capable APK (no game payload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4

      - name: Ensure no copyrighted game payload is accidentally included
        run: |
          test ! -f android/app/src/main/assets/offline.html
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble offline loader
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload offline loader (requires private HTML import)
        uses: actions/upload-artifact@v4
        with:
          name: isaac-android-offline-loader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
