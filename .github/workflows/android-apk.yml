name: Android Offline Loader APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build offline-capable APK (no game payload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4

      - name: Ensure no copyrighted game payload is accidentally included
        run: |
          test ! -f android/app/src/main/assets/offline.html
          ! grep -Eq '<uses-permission[^>]+android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Validate offline packaging scripts (without game data)
        run: |
          python3 -m py_compile scripts/android/fetch_upstream_chunks.py
          bash -n android/package-upstream-chunks.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble offline loader
        run: ./android/gradlew -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK is network-free and contains no game payload
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump permissions "$APK" > /tmp/isaac-apk-permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/isaac-apk-permissions.txt
          ! unzip -Z1 "$APK" | grep -Fq 'assets/offline.html'

      - name: Upload offline loader (requires private HTML import)
        uses: actions/upload-artifact@v4
        with:
          name: isaac-android-offline-loader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
